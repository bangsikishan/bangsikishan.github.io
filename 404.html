<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — Kishan Magar</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F2F0EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171512" media="(prefers-color-scheme: dark)">
<!-- Icon + home paths are absolute so they resolve from any missing
     URL. If the site lives under a subpath (e.g. a GitHub Pages
     project site), prefix them with that subpath. -->
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F0EA; --ink:#1C1A17; --ink-soft:#6E6A61;
  --line-strong:#8F8A7F; --accent:#54718A; --ink-hover:#000;
  --serif:"Newsreader", Georgia, "Times New Roman", serif;
  --mono:"Spline Sans Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#171512; --ink:#EAE6DD; --ink-soft:#9B968A;
    --line-strong:#5A554B; --accent:#8BA8C0; --ink-hover:#FFF;
  }
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;min-height:100svh;
  display:grid;place-items:center;
  background:var(--paper);color:var(--ink);
  font-family:var(--serif);font-size:1.0625rem;line-height:1.65;
  padding:5.5rem clamp(1.25rem, 5vw, 3rem) 3rem;
}
.brand{
  position:absolute;top:0;left:0;
  padding:1.05rem clamp(1.25rem, 5vw, 3rem);
  font-size:1.2rem;font-weight:600;color:var(--ink);text-decoration:none;
}
main{
  display:grid;justify-items:center;gap:.65rem;text-align:center;
  border:1px dashed var(--line-strong);border-radius:2px;
  padding:clamp(2.25rem, 6vw, 4rem) clamp(1.5rem, 5vw, 3.5rem);
  max-width:34rem;width:100%;
}
.path{
  margin:0;font-family:var(--mono);font-size:.78rem;
  letter-spacing:.04em;color:var(--ink-soft);
}
.path::after{
  content:"\258B";margin-left:.2em;color:var(--accent);
  animation:blink 1.1s steps(1) infinite;
}
@keyframes blink{50%{opacity:0}}
h1{
  margin:0;font-weight:500;line-height:1.2;
  font-size:clamp(1.4rem, 1.1rem + 1.4vw, 1.9rem);
}
p{margin:0;color:var(--ink-soft);max-width:40ch}
.button{
  display:inline-flex;align-items:center;gap:.5rem;margin-top:.7rem;
  font-family:var(--mono);font-size:.82rem;font-weight:500;
  color:var(--paper);background:var(--ink);
  border:1px solid var(--ink);border-radius:2px;
  padding:.6rem 1rem;text-decoration:none;
  transition:background .15s ease;
}
.button:hover{background:var(--ink-hover)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@media (prefers-reduced-motion: reduce){
  .path::after{animation:none}
  .button{transition:none}
}
</style>
</head>
<body>
<a class="brand" href="/">Kishan Magar</a>
<main>
  <p class="path">~/404</p>
  <h1>Page not found.</h1>
  <p>This address may have moved, or it never existed.</p>
  <a class="button" href="/">Back to home</a>
</main>
</body>
</html>
